name: astrbot_plugin_noreply
display_name: AstrBot NoReply
short_desc: 无需 @ 或关键词唤醒，让机器人根据人设和群聊内容自主选择回复或沉默。
desc: >-
  让机器人主动参与群聊，无需 @ 或关键词唤醒：结合人设、近期聊天内容和参与策略，
  对每条待处理消息判断是否回应，需要时生成回复，否则保持沉默；被 @ 时必须回复。
  多条消息可在一次模型调用中逐条处理，各群独立保存聊天背景，忙时排队。
  支持通过 WebUI 配置人设、参与群、回复策略、发言间隔和背景条数，
  并用命令清空当前群上下文、重新开始。
  当前支持 QQ 官方机器人文本群聊；即使最终不发言，模型判断仍会计费。
version: v0.1.0
author: M.Joe
repo: https://github.com/678mjoe/astrbot_plugin_noreply
astrbot_version: ">=4.29.3"
support_platforms:
  - qq_official
tags:
  - 群聊
  - 自主回复
  - 上下文
