[project]
name = "astrbot-plugin-noreply"
version = "0.1.0"
description = "Context-aware, text-only autonomous group replies for AstrBot"
requires-python = ">=3.12"
dependencies = []

[dependency-groups]
dev = [
    "astrbot==4.29.3",
    "pytest>=8,<10",
    "pytest-asyncio>=1,<2",
    "ruff>=0.11",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
pythonpath = [".", ".."]

[tool.ruff]
target-version = "py312"
include = ["engine.py", "main.py", "diagnostics.py", "native_context.py", "tests/**/*.py"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B", "ASYNC"]
