[project]
name = "astrbot-plugin-noreply"
version = "0.1.0"
description = "Context-aware, text-only autonomous group replies for AstrBot"
requires-python = ">=3.12"
dependencies = []
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "M.Joe" }]

[project.urls]
Repository = "https://github.com/678mjoe/astrbot_plugin_noreply"
Issues = "https://github.com/678mjoe/astrbot_plugin_noreply/issues"

[dependency-groups]
dev = [
    "astrbot==4.29.3",
    "pytest>=8,<10",
    "pytest-asyncio>=1,<2",
    "ruff>=0.11",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
pythonpath = [".", ".."]

[tool.ruff]
target-version = "py312"
include = ["engine.py", "main.py", "diagnostics.py", "native_context.py", "batch_*.py", "prompt_cache.py", "scripts/*.py", "tools/build_release.py", "tests/**/*.py"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B", "ASYNC"]
